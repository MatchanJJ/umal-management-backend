name: d1-backup

on:
  schedule:
    - cron: '0 19 * * 0' # Mon 03:00 Asia/Manila
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y age
      - name: Export, compress, encrypt
        env:
          BACKUP_PUBKEY: ${{ secrets.BACKUP_PUBKEY }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_PUBKEY" || { echo "BACKUP_PUBKEY secret missing"; exit 1; }
          stamp=$(date -u +%Y%m%dT%H%MZ)
          pnpm exec wrangler d1 export umal-prod --remote --env production --output backup.sql
          gzip -9 backup.sql
          age -r "$BACKUP_PUBKEY" -o "umal-prod-$stamp.sql.gz.age" backup.sql.gz
          shred -u backup.sql.gz
          echo "FILE=umal-prod-$stamp.sql.gz.age" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}
          retention-days: 30
